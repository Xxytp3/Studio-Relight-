<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relight</title>
<style>
:root{
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --bg:#2a2c2f;
  --bg2:#363a3e;
  --panel:#222427;
  --raise:#2d3034;
  --raise2:#3a3e44;
  --line:#3c4046;
  --ink:#ebe8e2;
  --mute:#9ba0a7;
  --track:#43474d;
  --gel:#ffd9ab;
  --gel-ink:#1a1b1d;
  --stage-h:46vh;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--panel);color:var(--ink);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gel);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:560px}

/* header */
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:650;letter-spacing:-.015em}
.brand .mark{color:var(--gel)}
.actions{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--raise);cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13.5px}
.btn:hover{border-color:#5a5f67}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--gel);color:var(--gel-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}

/* work area */
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:none;height:var(--stage-h);overflow:hidden;background:radial-gradient(130% 100% at 50% 32%,var(--bg2),var(--bg) 70%)}
#gl{position:absolute;display:block;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#ui{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;outline:none}
#ui:focus-visible{outline:2px solid var(--gel);outline-offset:-3px}
.viewseg{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(24,26,28,.84);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.viewseg button{height:28px;padding:0 13px;border:0;border-radius:7px;background:transparent;color:var(--mute);cursor:pointer;font-size:13px}
.viewseg button[aria-pressed=true]{background:var(--raise2);color:var(--ink)}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);max-width:calc(100% - 24px);padding:7px 12px;border-radius:9px;background:rgba(20,22,24,.92);border:1px solid var(--line);font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:3}
.toast.on{opacity:1;transform:translate(-50%,0)}
.veil{position:absolute;inset:8px;display:none;align-items:center;justify-content:center;border:2px dashed var(--gel);border-radius:14px;background:rgba(30,32,35,.78);font-size:15px;pointer-events:none;z-index:4}
.veil.on{display:flex}
.glerr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:var(--bg);font-size:14px}
.glerr[hidden]{display:none}
.glerr small{color:var(--mute);max-width:560px;max-height:120px;overflow:auto;font-size:11.5px;white-space:pre-wrap;text-align:left}

/* panel */
.panel{flex:1;min-height:0;overflow-y:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom));background:var(--panel)}
.dock{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.dock::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:6px;flex:none}
.grp+.grp{margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
.rowhead{display:none;font-size:12.5px;color:var(--mute)}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--raise);font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#5a5f67}
.chip[aria-pressed=true]{border-color:var(--gel);box-shadow:inset 0 0 0 1px var(--gel)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;margin:2px 0 14px;border-radius:10px;background:var(--raise)}
.tab{height:32px;border:0;border-radius:8px;background:transparent;color:var(--mute);cursor:pointer;font-size:13.5px}
.tab[aria-selected=true]{background:var(--raise2);color:var(--ink)}

.ctl{margin-bottom:14px}
.ctl .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.ctl label,.ctl .lbl{font-size:13.5px}
.ctl output{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12.5px;color:var(--mute);margin:-2px 0 8px}

input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:0;background:transparent;touch-action:pan-y;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--tb,linear-gradient(to right,var(--gel) var(--p,50%),var(--track) var(--p,50%)))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--tb2,var(--track))}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--prog,var(--gel))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);box-shadow:0 0 0 1px #555a61}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);box-shadow:0 0 0 1px #555a61}

.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--raise)}
.seg button{flex:1;height:28px;border:0;border-radius:6px;background:transparent;color:var(--mute);cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--raise2);color:var(--ink)}
.colorblock{padding-top:4px;border-top:1px solid var(--line);margin-top:4px}
.colorblock .top{margin:12px 0 8px}
.nowchip{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:7px;border:1px solid rgba(255,255,255,.35)}
.gels{display:flex;gap:10px;margin:2px 0 6px;flex-wrap:wrap}
.gel{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px #555a61;cursor:pointer}
.gel:hover{box-shadow:0 0 0 2px var(--ink)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.row .txt{min-width:0}
.row .txt small{display:block;color:var(--mute);font-size:12.5px}
.switch{flex:none;position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--track);cursor:pointer;transition:background .15s}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked=true]{background:var(--gel)}
.switch[aria-checked=true] .knob{transform:translateX(18px);background:var(--gel-ink)}
.hint{color:var(--mute);font-size:12.5px;line-height:1.5;margin-top:2px}
.foot{display:flex;justify-content:flex-end;margin-top:6px}

/* export sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,11,12,.62)}
.sheet[hidden]{display:none}
.card{width:min(540px,100%);max-height:94%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:16px 16px 0 0;background:var(--panel)}
.card h2{font-size:17px;font-weight:650;margin-bottom:12px}
.pv{display:flex;align-items:center;justify-content:center;min-height:150px;margin-bottom:12px;border-radius:10px;background:var(--bg);overflow:hidden}
.pv img{display:block;max-width:100%;max-height:40vh;-webkit-touch-callout:default}
.pv span{color:var(--mute);font-size:13px;padding:20px;text-align:center}
.meta{font-size:13px;color:var(--mute);margin-bottom:12px;min-height:20px}
.card .seg{margin-bottom:12px}
.btns{display:flex;gap:8px}
.btns .btn{flex:1;justify-content:center;height:40px}
.btns .btn[aria-disabled=true]{opacity:.45;pointer-events:none}
@media (min-width:900px){
  .sheet{align-items:center}
  .card{border-radius:16px}
}

/* desktop layout */
@media (min-width:900px){
  .work{flex-direction:row}
  .stage{flex:1;height:auto}
  .panel{flex:none;width:368px;border-left:1px solid var(--line);padding:16px 18px 24px}
  .dock{flex-direction:column;overflow:visible;gap:14px;padding-bottom:16px}
  .grp{flex-wrap:wrap;gap:6px}
  .grp+.grp{margin:0;padding:0;border:0}
  .rowhead{display:block;width:100%}
}
@media (max-width:420px){
  .brand span{display:none}
  .btn{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      <span>Relight</span>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnSample" type="button">Sample</button>
      <button class="btn" id="btnOpen" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
        Open photo
      </button>
      <button class="btn primary" id="btnExport" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>
        Export
      </button>
    </div>
  </header>

  <main class="work">
    <section class="stage" id="stage" aria-label="Photo preview">
      <canvas id="gl" aria-hidden="true"></canvas>
      <canvas id="ui" tabindex="0" role="application" aria-label="Light placement. Drag to move the light. Arrow keys nudge it. Page Up and Page Down change its height."></canvas>
      <div class="viewseg" role="group" aria-label="Compare">
        <button type="button" data-view="relit" aria-pressed="true">Relit</button>
        <button type="button" data-view="original" aria-pressed="false">Original</button>
        <button type="button" data-view="split" aria-pressed="false">Split</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="veil" id="veil">Drop a photo to relight it</div>
      <div class="glerr" id="glerr" hidden></div>
    </section>
    <aside class="panel" id="panel" aria-label="Lighting controls"></aside>
  </main>

  <div class="sheet" id="sheet" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Export relit photo</h2>
      <div class="pv" id="pv"><span>Rendering at full resolution</span></div>
      <div class="meta" id="meta"></div>
      <div class="seg" id="fmtSeg" role="group" aria-label="File format">
        <button type="button" data-fmt="png" aria-pressed="true">PNG</button>
        <button type="button" data-fmt="jpeg" aria-pressed="false">JPEG</button>
      </div>
      <div class="btns">
        <a class="btn primary" id="dl" role="button" aria-disabled="true">Download</a>
        <button class="btn" id="sheetClose" type="button">Close</button>
      </div>
      <p class="hint" style="margin-top:10px">If the download doesn’t start, press and hold the image above to save it.</p>
    </div>
  </div>

  <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
</div>

<script>
(() => {
'use strict';

const FONT = '"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif';
const TAU = Math.PI * 2;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* PURE:BEGIN ------------------------------------------------------------ */

/* Gaussian blur approximated by three box passes (running sums, clamped edges). */
function boxesForGauss(sigma, n) {
  const wIdeal = Math.sqrt((12 * sigma * sigma) / n + 1);
  let wl = Math.floor(wIdeal);
  if (wl % 2 === 0) wl--;
  const wu = wl + 2;
  const mIdeal = (12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4);
  const m = Math.round(mIdeal);
  const sizes = [];
  for (let i = 0; i < n; i++) sizes.push(i < m ? wl : wu);
  return sizes;
}
function boxBlurH(scl, tcl, w, h, r) {
  const iarr = 1 / (r + r + 1);
  for (let i = 0; i < h; i++) {
    let ti = i * w, li = ti, ri = ti + r;
    const fv = scl[ti], lv = scl[ti + w - 1];
    let val = (r + 1) * fv;
    for (let j = 0; j < r; j++) val += scl[ti + j];
    for (let j = 0; j <= r; j++) { val += scl[ri++] - fv; tcl[ti++] = val * iarr; }
    for (let j = r + 1; j < w - r; j++) { val += scl[ri++] - scl[li++]; tcl[ti++] = val * iarr; }
    for (let j = w - r; j < w; j++) { val += lv - scl[li++]; tcl[ti++] = val * iarr; }
  }
}
function boxBlurT(scl, tcl, w, h, r) {
  const iarr = 1 / (r + r + 1);
  for (let i = 0; i < w; i++) {
    let ti = i, li = ti, ri = ti + r * w;
    const fv = scl[ti], lv = scl[ti + w * (h - 1)];
    let val = (r + 1) * fv;
    for (let j = 0; j < r; j++) val += scl[ti + j * w];
    for (let j = 0; j <= r; j++) { val += scl[ri] - fv; tcl[ti] = val * iarr; ri += w; ti += w; }
    for (let j = r + 1; j < h - r; j++) { val += scl[ri] - scl[li]; tcl[ti] = val * iarr; ri += w; li += w; ti += w; }
    for (let j = h - r; j < h; j++) { val += lv - scl[li]; tcl[ti] = val * iarr; li += w; ti += w; }
  }
}
function boxBlur(scl, tcl, w, h, r) {
  tcl.set(scl);
  boxBlurH(tcl, scl, w, h, r);
  boxBlurT(scl, tcl, w, h, r);
}
function blur(src, w, h, sigma) {
  const s = Math.max(0.5, Math.min(sigma, (Math.min(w, h) - 3) / 3));
  const a = Float32Array.from(src), b = new Float32Array(src.length);
  const bx = boxesForGauss(s, 3);
  boxBlur(a, b, w, h, (bx[0] - 1) / 2);
  boxBlur(b, a, w, h, (bx[1] - 1) / 2);
  boxBlur(a, b, w, h, (bx[2] - 1) / 2);
  return b;
}
function gradient(b, w, h) {
  const x = new Float32Array(w * h), y = new Float32Array(w * h);
  for (let j = 0; j < h; j++) {
    const jm = Math.max(j - 1, 0), jp = Math.min(j + 1, h - 1);
    for (let i = 0; i < w; i++) {
      const im = Math.max(i - 1, 0), ip = Math.min(i + 1, w - 1), k = j * w + i;
      x[k] = (b[j * w + ip] - b[j * w + im]) / ((ip - im) || 1);
      y[k] = (b[jp * w + i] - b[jm * w + i]) / ((jp - jm) || 1);
    }
  }
  return { x, y };
}
function percentile(arr, p) {
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < arr.length; i++) { const v = arr[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
  if (!(mx > mn)) return mn;
  const B = 2048, hist = new Uint32Array(B), k = (B - 1) / (mx - mn);
  for (let i = 0; i < arr.length; i++) hist[((arr[i] - mn) * k) | 0]++;
  const target = p * arr.length;
  let acc = 0;
  for (let b = 0; b < B; b++) { acc += hist[b]; if (acc >= target) return mn + (b + 1) / k; }
  return mx;
}
/* Normalise a gradient field so its 99.5th-percentile magnitude is 1, then compress (gamma) so
   gentle slopes still read as volume. Result vectors have length <= 1. */
function packVec(gx, gy, floor, gamma) {
  const n = gx.length, mag = new Float32Array(n);
  for (let i = 0; i < n; i++) mag[i] = Math.hypot(gx[i], gy[i]);
  const s = Math.max(percentile(mag, 0.995), floor);
  const ox = new Float32Array(n), oy = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const m = mag[i];
    if (m < 1e-9) continue;
    const f = Math.pow(Math.min(m / s, 1), gamma) / m;
    ox[i] = gx[i] * f; oy[i] = gy[i] * f;
  }
  return { x: ox, y: oy };
}
const enc = v => Math.round((clamp(v, -1, 1) * 0.5 + 0.5) * 255);

/* Luminance-based depth proxy -> packed textures.
   grad  RGBA: rg = coarse slope, ba = fine-detail slope (slope of fine blur minus coarse blur)
   hmap  RGBA: r = coarse luminance, g = stretched medium height, b = stretched coarse height */
function analyze(imgData) {
  const w = imgData.width, h = imgData.height, n = w * h, d = imgData.data;
  const lum = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) lum[i] = (0.2126 * d[j] + 0.7152 * d[j + 1] + 0.0722 * d[j + 2]) / 255;
  const L = Math.max(w, h);
  const bC = blur(lum, w, h, Math.max(1.5, 0.022 * L));
  const bM = blur(lum, w, h, Math.max(1.0, 0.008 * L));
  const bF = blur(lum, w, h, Math.max(1.0, 0.003 * L));
  const gc = gradient(bC, w, h), gf = gradient(bF, w, h);
  const dx = new Float32Array(n), dy = new Float32Array(n);
  for (let i = 0; i < n; i++) { dx[i] = gf.x[i] - gc.x[i]; dy[i] = gf.y[i] - gc.y[i]; }
  const pc = packVec(gc.x, gc.y, 0.004, 0.65);
  const pd = packVec(dx, dy, 0.003, 0.7);
  const lo = percentile(bM, 0.02);
  let hi = percentile(bM, 0.98);
  if (hi - lo < 0.06) hi = lo + 0.06;
  const st = v => clamp((v - lo) / (hi - lo), 0, 1);
  const grad = new Uint8Array(n * 4), hmap = new Uint8Array(n * 4);
  let mean = 0;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    grad[o] = enc(pc.x[i]); grad[o + 1] = enc(pc.y[i]); grad[o + 2] = enc(pd.x[i]); grad[o + 3] = enc(pd.y[i]);
    hmap[o] = Math.round(clamp(bC[i], 0, 1) * 255);
    hmap[o + 1] = Math.round(st(bM[i]) * 255);
    hmap[o + 2] = Math.round(st(bC[i]) * 255);
    hmap[o + 3] = 255;
    mean += bC[i];
  }
  return { w, h, grad, hmap, meanLum: Math.max(mean / n, 0.02) };
}

/* Colour temperature (Kelvin) to sRGB, Tanner Helland approximation. */
function kelvinToRGB(k) {
  const t = clamp(k, 1000, 40000) / 100;
  let r, g, b;
  if (t <= 66) {
    r = 255;
    g = 99.4708025861 * Math.log(t) - 161.1195681661;
    b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  } else {
    r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    b = 255;
  }
  return [r, g, b].map(v => Math.round(clamp(v, 0, 255)));
}
/* PURE:END -------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */
/* DOM helper                                                              */
/* ---------------------------------------------------------------------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const nextFrame = () => new Promise(res => {
  let done = false;
  const f = () => { if (!done) { done = true; res(); } };
  requestAnimationFrame(f); setTimeout(f, 60);
});

/* ---------------------------------------------------------------------- */
/* State                                                                   */
/* ---------------------------------------------------------------------- */
const DEFAULTS = {
  lx: 0.12, ly: 0.10, lz: 0.55,
  intensity: 1.6, radius: 2.4, falloff: 1.0,
  mode: 'temp', kelvin: 5200, rgb: [255, 236, 214],

/* Decode a user file without relying on blob: URLs, which sandboxed previews often block.
   Order: data URL -> <img> (reliable EXIF rotation), createImageBitmap, then blob URL as a last resort. */
async function decodeFile(file) {
  const notes = [];
  const msg = e => String((e && e.message) || e || 'unknown');
  try {
    const dataUrl = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(fr.error || new Error('could not read the file'));
      fr.readAsDataURL(file);
    });
    const im = await loadImage(dataUrl);
    if (im.naturalWidth) return { src: im, w: im.naturalWidth, h: im.naturalHeight, url: null };
    notes.push('data URL decoded to an empty image');
  } catch (e) { notes.push('data URL: ' + msg(e)); }
  if (window.createImageBitmap) {
    try {
      let bmp;
      try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch (e) { bmp = await createImageBitmap(file); }
      if (bmp && bmp.width) return { src: bmp, w: bmp.width, h: bmp.height, url: null };
    } catch (e) { notes.push('bitmap: ' + msg(e)); }
  }
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImage(url);
    if (im.naturalWidth) return { src: im, w: im.naturalWidth, h: im.naturalHeight, url };
    notes.push('blob URL decoded to an empty image');
  } catch (e) { notes.push('blob URL: ' + msg(e)); }
  URL.revokeObjectURL(url);
  const err = new Error('decode');
  err.detail = notes.join('; ');
  throw err;
}

async function loadFile(file) {
  if (!file) return;
  if (file.type && !/^image\//.test(file.type)) { toast('That file isn’t an image. Choose a JPEG or PNG.'); return; }
  toast('Reading photo', 0);
  let dec;
  try {
    dec = await decodeFile(file);
  } catch (err) {
    toast('This browser couldn’t decode that file (' + (err.detail || 'unknown reason').slice(0, 140) + ').', 8000);
    return;
  }
  try {
    await setSource(dec.src, dec.w, dec.h, file.name.replace(/\.[^.]+$/, '') || 'photo');
    if (state.url) URL.revokeObjectURL(state.url);
    state.url = dec.url;
    toast(`Opened ${dec.w} × ${dec.h} px`);
  } catch (err) {
    if (dec.url) URL.revokeObjectURL(dec.url);
    toast('The photo opened but couldn’t be processed: ' + String((err && err.message) || err).slice(0, 160), 8000);
  }
}

    h('p', { class: 'hint', style: 'margin-top:14px' }, hover ? 'Drag on the photo to place the light. Scroll over it to change height.' : 'Drag on the photo to place the light. Use Height to raise or lower it.'));

  invertSwitch = h('button', { class: 'switch', type: 'button', role: 'switch', 'aria-checked': 'false', 'aria-label': 'Invert depth' }, h('span', { class: 'knob' }));
  invertSwitch.addEventListener('click', () => { P.invert = !P.invert; manual(); });
  panes.depth.append(
    h('div', { class: 'row' }, h('div', { class: 'txt' }, 'Invert depth', h('small', {}, 'Use when dark areas should read as closer.')), invertSwitch));

  const pseg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Preview' });
  [['Final', 0], ['Normals', 1], ['Depth', 2]].forEach(([label, v]) => {
    const b = h('button', { type: 'button', 'aria-pressed': 'false' }, label);
    b.addEventListener('click', () => { preview = v; invalidate(); });
    previewBtns.push(b); pseg.append(b);
  });
  panes.depth.append(h('div', { class: 'ctl' }, h('div', { class: 'top' }, h('span', { class: 'lbl' }, 'Preview')), pseg),
    h('p', { class: 'hint' }, 'Relight estimates surface direction from brightness. Check the normal map to see what the light is reacting to.'));

  const reset = h('button', { class: 'btn ghost', type: 'button' }, 'Reset controls');
  reset.addEventListener('click', () => {
    Object.assign(P, DEFAULTS, { rgb: DEFAULTS.rgb.slice() });
    activeLook = 'Top-Left Key Light'; preview = 0; syncLooks(); invalidate();
  });
  panel.append(tabBar, ...Object.values(panes), h('div', { class: 'foot' }, reset));
  syncLooks();
}

function syncControls() {
  const [r, g, b] = gelColor();
  const root = document.documentElement;
  root.style.setProperty('--gel', `rgb(${r},${g},${b})`);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  root.style.setProperty('--gel-ink', lum > 135 ? '#1a1b1d' : '#ffffff');
  sliderRefs.forEach(({ def, inp, out, read }) => {
    const v = read();
    if (inp.valueAsNumber !== v) inp.value = v;
    out.textContent = def.fmt(v);
    inp.style.setProperty('--p', ((v - def.min) / (def.max - def.min) * 100) + '%');
  });
  const c = lightRGB();
  swatchNow.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
  swatchOut.textContent = P.mode === 'temp' ? Math.round(P.kelvin) + ' K' : '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  modeBtns.temp.setAttribute('aria-pressed', String(P.mode === 'temp'));
  modeBtns.rgb.setAttribute('aria-pressed', String(P.mode === 'rgb'));
  colorPanes.temp.hidden = P.mode !== 'temp';
  colorPanes.rgb.hidden = P.mode !== 'rgb';
  invertSwitch.setAttribute('aria-checked', String(P.invert));
  previewBtns.forEach((bt, i) => bt.setAttribute('aria-pressed', String(i === preview)));
}

/* compare */
function setView(v) {
  V = v;
  document.querySelectorAll('.viewseg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  invalidate();
}
document.querySelectorAll('.viewseg button').forEach(b => b.addEventListener('click', () => { preview = 0; setView(b.dataset.view); }));

/* ---------------------------------------------------------------------- */
/* Toast                                                                   */
/* ---------------------------------------------------------------------- */
const toastEl = $('#toast');
let toastT = 0;
function toast(msg, ms = 2800) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT);
  if (ms) toastT = setTimeout(() => toastEl.classList.remove('on'), ms);
}
function hideToast() { clearTimeout(toastT); toastEl.classList.remove('on'); }

/* ---------------------------------------------------------------------- */
/* Export                                                                  */
/* ---------------------------------------------------------------------- */
const sheet = $('#sheet'), pv = $('#pv'), meta = $('#meta'), dl = $('#dl');
const exp = { canvas: null, url: null, fmt: 'png', size: null, token: 0 };

function renderFull() {
  const gl = GL.gl, nat = state.nat;
  const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  const maxSide = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), vp[0], vp[1], 8192);
  let s = Math.min(1, maxSide / Math.max(nat.w, nat.h));
  const AREA = 16777216;                       // keep within common mobile canvas limits
  if (nat.w * nat.h * s * s > AREA) s = Math.sqrt(AREA / (nat.w * nat.h));
  const ew = Math.max(1, Math.floor(nat.w * s)), eh = Math.max(1, Math.floor(nat.h * s));
  const full = drawToCanvas(state.src, ew, eh, false);
  const tex = texFromSource(full);
  full.width = full.height = 1;
  const pw = glc.width, ph = glc.height;
  glc.width = ew; glc.height = eh;
  try {
    draw({ tex, final: true });
    const out = document.createElement('canvas');
    out.width = ew; out.height = eh;
    out.getContext('2d').drawImage(glc, 0, 0);
    return { canvas: out, w: ew, h: eh };
  } finally {
    gl.deleteTexture(tex);
    glc.width = pw; glc.height = ph;
    invalidate();
  }
}

function encodeExport() {
  const token = ++exp.token;
  const type = exp.fmt === 'png' ? 'image/png' : 'image/jpeg';
  dl.setAttribute('aria-disabled', 'true');
  exp.canvas.toBlob(blob => {
    if (token !== exp.token || !blob) {
      if (!blob && token === exp.token) meta.textContent = 'This device couldn’t encode the image. Try the other format.';
      return;
    }
    if (exp.url) URL.revokeObjectURL(exp.url);
    exp.url = URL.createObjectURL(blob);
    const ext = exp.fmt === 'png' ? 'png' : 'jpg';
    const img = h('img', { alt: 'Relit photo preview' });
    img.onerror = () => {
      if (img.dataset.fb) return;
      img.dataset.fb = '1';
      const fr = new FileReader();
      fr.onload = () => { img.src = fr.result; dl.href = fr.result; };
      fr.readAsDataURL(blob);
    };
    img.src = exp.url;
    pv.replaceChildren(img);
    const note = (exp.size.w !== state.nat.w || exp.size.h !== state.nat.h) ? `, reduced from ${state.nat.w} × ${state.nat.h} to fit this device` : '';
    meta.textContent = `${exp.size.w} × ${exp.size.h} px, ${exp.fmt.toUpperCase()}, ${(blob.size / 1048576).toFixed(1)} MB${note}`;
    dl.href = exp.url;
    dl.setAttribute('download', `${state.name}-relit.${ext}`);
    dl.textContent = `Download ${exp.fmt.toUpperCase()}`;
    dl.removeAttribute('aria-disabled');
  }, type, 0.93);
}

async function openExport() {
  if (!state.assets) return;
  sheet.hidden = false;
  pv.replaceChildren(h('span', {}, 'Rendering at full resolution'));
  meta.textContent = '';
  dl.setAttribute('aria-disabled', 'true'); dl.removeAttribute('href');
  await nextFrame(); await nextFrame();
  try {
    const r = renderFull();
    exp.canvas = r.canvas; exp.size = { w: r.w, h: r.h };
    encodeExport();
  } catch (err) {
    pv.replaceChildren(h('span', {}, 'Export failed. The photo may be too large for this device. Close this and try again.'));
  }
}
function closeExport() {
  sheet.hidden = true; exp.token++;
  if (exp.url) { URL.revokeObjectURL(exp.url); exp.url = null; }
  exp.canvas = null;
  pv.replaceChildren();
}
$('#btnExport').addEventListener('click', openExport);
$('#sheetClose').addEventListener('click', closeExport);
sheet.addEventListener('click', e => { if (e.target === sheet) closeExport(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeExport(); });
document.querySelectorAll('#fmtSeg button').forEach(b => b.addEventListener('click', () => {
  exp.fmt = b.dataset.fmt;
  document.querySelectorAll('#fmtSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (exp.canvas) encodeExport();
}));

/* ---------------------------------------------------------------------- */
/* File input + drag and drop                                              */
/* ---------------------------------------------------------------------- */
const fileIn = $('#file'), veil = $('#veil');
$('#btnOpen').addEventListener('click', () => fileIn.click());
$('#btnSample').addEventListener('click', async () => { await loadSample(); toast('Loaded the sample still life'); });
fileIn.addEventListener('change', () => {
  const f = fileIn.files && fileIn.files[0];
  if (f) loadFile(f).finally(() => { fileIn.value = ''; });
});
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; veil.classList.add('on'); } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) veil.classList.remove('on'); });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; veil.classList.remove('on');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

/* ---------------------------------------------------------------------- */
/* Boot                                                                    */
/* ---------------------------------------------------------------------- */
function showGLError(err) {
  const box = $('#glerr');
  box.hidden = false;
  box.replaceChildren(
    h('strong', {}, 'Relighting needs WebGL'),
    h('span', {}, 'This preview couldn’t start the graphics engine. Try another browser or enable hardware acceleration.'),
    h('small', {}, String(err && err.message ? err.message : err)));
}

glc.addEventListener('webglcontextlost', e => { e.preventDefault(); });
glc.addEventListener('webglcontextrestored', () => {
  try { initGL(); uploadAssets(); invalidate(); } catch (err) { showGLError(err); }
});
window.addEventListener('error', e => {
  if (e && e.message && !/ResizeObserver/i.test(e.message)) toast('Something went wrong: ' + e.message, 4000);
});

buildPanel();
syncControls();
try {
  initGL();
  new ResizeObserver(layout).observe(stage);
  layout();
  loadSample().catch(err => showGLError(err));
} catch (err) {
  showGLError(err);
}
})();
</script>
</body>
</html>
