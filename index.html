<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#222427">
<title>Relight</title>
<style>
/* Design read: dark studio tool for photographers. One accent (the live light color, called the gel),
   one radius scale, one palette. Controls use hairlines and spacing instead of cards.
   Shape rule: rectangular controls use --r, nested controls use --r-in, single-value tokens (knob, swatch, switch) are circles/pills. */
:root{
  color-scheme:dark;
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --bg:#2a2c2f;
  --bg2:#363a3e;
  --panel:#222427;
  --raise:#2d3034;
  --raise2:#3a3e44;
  --line:#3c4046;
  --line2:#4b5057;
  --ink:#ebe8e2;
  --mute:#a3a8af;
  --track:#43474d;
  --gel:#ffd9ab;
  --gel-ink:#1a1b1d;
  --r:10px;
  --r-in:7px;
  --stage-h:44vh;
  --z-ui:2;
  --z-toast:3;
  --z-veil:4;
  --z-error:5;
  --z-sheet:20;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--panel);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (pointer:fine){html{overscroll-behavior:none}}
button{font:inherit;color:inherit;touch-action:manipulation}
h1,h2{text-wrap:balance}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--gel);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-64px;z-index:var(--z-sheet);padding:8px 14px;border-radius:var(--r);background:var(--gel);color:var(--gel-ink);font-weight:650;text-decoration:none}
.skip:focus{top:8px}
body.dragging{user-select:none;-webkit-user-select:none}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:560px}

/* header */
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:56px;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.mark{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--gel);background:radial-gradient(circle,var(--gel) 0 34%,transparent 38%)}
.actions{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line2);background:var(--raise);cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13.5px;font-weight:500;transition:background-color .12s,border-color .12s,transform .12s}
.btn:hover{background:var(--raise2);border-color:#5d636b}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--gel);color:var(--gel-ink);border-color:transparent;font-weight:650}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);background:var(--raise)}

/* work area */
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:none;height:var(--stage-h);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:radial-gradient(130% 100% at 50% 32%,var(--bg2),var(--bg) 70%)}
#gl{position:absolute;display:block;box-shadow:0 12px 40px rgba(8,10,12,.4)}
#ui{position:absolute;inset:0;z-index:var(--z-ui);width:100%;height:100%;touch-action:none;cursor:crosshair;outline:none}
#ui:focus-visible{outline:2px solid var(--gel);outline-offset:-3px}
.viewseg{position:absolute;left:50%;bottom:8px;z-index:var(--z-toast);transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:var(--r);background:rgba(24,26,28,.86);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.viewseg button{height:30px;padding:0 14px;border:0;border-radius:var(--r-in);background:transparent;color:var(--mute);cursor:pointer;font-size:13px;font-weight:500;transition:background-color .12s,color .12s}
.viewseg button:hover{color:var(--ink)}
.viewseg button[aria-pressed=true]{background:var(--raise2);color:var(--ink)}
.toast{position:absolute;left:50%;top:10px;z-index:var(--z-toast);transform:translate(-50%,-8px);display:flex;align-items:center;gap:12px;max-width:calc(100% - 24px);padding:8px 12px;border-radius:var(--r);background:rgba(20,22,24,.94);border:1px solid var(--line2);font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast-act{flex:none;height:28px;padding:0 10px;border:0;border-radius:var(--r-in);background:var(--gel);color:var(--gel-ink);font-weight:650;font-size:12.5px;cursor:pointer}
.veil{position:absolute;inset:8px;z-index:var(--z-veil);display:none;align-items:center;justify-content:center;border:2px dashed var(--gel);border-radius:var(--r);background:rgba(30,32,35,.8);font-size:15px;pointer-events:none}
.veil.on{display:flex}
.glerr{position:absolute;inset:0;z-index:var(--z-error);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:var(--bg);font-size:14px}
.glerr small{color:var(--mute);max-width:560px;max-height:120px;overflow:auto;font-size:12px;white-space:pre-wrap;text-align:left}

/* panel */
.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px max(14px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:var(--panel)}
.dock{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.dock::-webkit-scrollbar{display:none}
.grp{flex:none}
.grp+.grp{padding-left:10px;border-left:1px solid var(--line)}
.chips{display:flex;gap:6px}
.chip{flex:none;height:34px;padding:0 13px;border-radius:var(--r);border:1px solid var(--line2);background:var(--raise);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .12s,border-color .12s,transform .12s}
.chip:hover{background:var(--raise2)}
.chip:active{transform:scale(.98)}
.chip[aria-pressed=true]{border-color:var(--gel);background:var(--raise2);background:color-mix(in srgb,var(--gel) 16%,var(--raise))}

.tabs{display:flex;gap:20px;margin:14px 0 18px;border-bottom:1px solid var(--line)}
.tab{position:relative;height:40px;padding:0 2px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:14px;font-weight:600;transition:color .12s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gel)}

.ctl{margin-bottom:12px}
.ctl .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ctl .lbl{font-size:13.5px}
.ctl output{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}

/* custom slider: only moves when the handle is grabbed (touch) or dragged (mouse), so page scrolling never changes it */
.sl{position:relative;height:36px;touch-action:pan-y;cursor:pointer;outline:none;user-select:none;-webkit-user-select:none}
.sl .rail{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--tb,var(--track))}
.sl .fill{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--gel);width:calc(11px + var(--f,.5) * (100% - 22px))}
.sl.plain .fill{display:none}
.sl .knob{position:absolute;top:50%;left:calc(var(--f,.5) * (100% - 22px));width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line2)}
.sl:focus-visible .knob{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--gel)}
.sl.drag .knob{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--gel)}

.seg{display:flex;gap:2px;padding:3px;border-radius:var(--r);background:var(--raise)}
.seg button{flex:1;height:30px;border:0;border-radius:var(--r-in);background:transparent;color:var(--mute);cursor:pointer;font-size:13px;font-weight:500;transition:background-color .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--raise2);color:var(--ink)}

.block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.block .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13.5px;font-weight:600}
.block .head output{font-weight:400;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.nowchip{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:7px;border:1px solid rgba(255,255,255,.35)}
.sub{font-size:12.5px;color:var(--mute);margin:6px 0 8px}
.gels{display:flex;gap:10px;flex-wrap:wrap}
.gel{width:32px;height:32px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2);cursor:pointer;transition:box-shadow .12s,transform .12s}
.gel:hover{box-shadow:0 0 0 2px var(--ink)}
.gel:active{transform:scale(.94)}

.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:4px 0 14px}
.row .txt{min-width:0;font-size:13.5px}
.row .txt small{display:block;color:var(--mute);font-size:12.5px;line-height:1.4}
.switch{flex:none;position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--track);cursor:pointer;transition:background-color .15s}
.switch .sw-knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .15s,background-color .15s}
.switch[aria-checked=true]{background:var(--gel)}
.switch[aria-checked=true] .sw-knob{transform:translateX(18px);background:var(--gel-ink)}
.hint{color:var(--mute);font-size:12.5px;line-height:1.5;margin-top:4px}
.foot{display:flex;justify-content:flex-end;margin-top:12px}

/* export sheet */
.sheet{position:fixed;inset:0;z-index:var(--z-sheet);display:flex;align-items:flex-end;justify-content:center;background:rgba(10,11,12,.66)}
.card{width:min(540px,100%);max-height:94%;overflow:auto;overscroll-behavior:contain;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;background:var(--panel)}
.card h2{font-size:17px;font-weight:650;margin-bottom:12px}
.pv{display:flex;align-items:center;justify-content:center;min-height:150px;margin-bottom:12px;border-radius:var(--r);background:var(--bg);overflow:hidden}
.pv img{display:block;width:auto;height:auto;max-width:100%;max-height:40vh}
.pv span{color:var(--mute);font-size:13px;padding:20px;text-align:center}
.meta{font-size:13px;color:var(--mute);margin-bottom:12px;min-height:20px;font-variant-numeric:tabular-nums}
.card .seg{margin-bottom:12px}
.btns{display:flex;gap:8px}
.btns .btn{flex:1;height:42px}
.btns .btn[aria-disabled=true]{opacity:.45;pointer-events:none}

/* desktop */
@media (min-width:900px){
  .work{flex-direction:row}
  .stage{flex:1;height:auto}
  .panel{flex:none;width:372px;border-left:1px solid var(--line);padding:18px 20px 28px}
  .dock{display:block;overflow:visible;padding-bottom:0}
  .grp+.grp{margin-top:18px;padding:0;border:0}
  .rowhead{position:static;width:auto;height:auto;clip:auto;overflow:visible;white-space:normal;margin-bottom:8px;font-size:13px;font-weight:650}
  .chips{display:grid;gap:8px}
  .chips.two{grid-template-columns:1fr 1fr}
  .chips.three{grid-template-columns:repeat(3,1fr)}
  .chip{height:auto;min-height:40px;padding:8px 10px;white-space:normal;text-align:center}
  .sheet{align-items:center}
  .card{border-radius:var(--r)}
}
@media (max-width:460px){
  .brand span.word{display:none}
  .btn{padding:0 11px}
  .long{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#panel">Skip to Controls</a>
<div class="app">
  <header class="bar">
    <h1 class="brand" translate="no"><span class="mark" aria-hidden="true"></span><span class="word">Relight</span></h1>
    <div class="actions">
      <button class="btn ghost" id="btnSample" type="button"><span class="long">Load&nbsp;</span>Sample</button>
      <button class="btn" id="btnOpen" type="button">Open Photo</button>
      <button class="btn primary" id="btnExport" type="button">Export</button>
    </div>
  </header>

  <main class="work" id="main">
    <section class="stage" id="stage" aria-label="Photo preview">
      <canvas id="gl" aria-hidden="true"></canvas>
      <canvas id="ui" tabindex="0" role="application" aria-label="Light placement. Drag the sun to move the light and the target ring to change where it aims. Arrow keys nudge the light, Alt plus arrow keys nudge the aim, Page Up and Page Down change height. In Split view, the open and close bracket keys move the divider."></canvas>
      <div class="viewseg" role="group" aria-label="Compare">
        <button type="button" data-view="relit" aria-pressed="true">Relit</button>
        <button type="button" data-view="original" aria-pressed="false">Original</button>
        <button type="button" data-view="split" aria-pressed="false">Split</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button class="toast-act" id="toastAct" type="button" hidden></button></div>
      <div class="veil" id="veil">Drop a photo to relight it</div>
      <div class="glerr" id="glerr" hidden></div>
    </section>
    <aside class="panel" id="panel" tabindex="-1" aria-label="Lighting controls"></aside>
  </main>

  <div class="sheet" id="sheet" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Export Relit Photo</h2>
      <div class="pv" id="pv"><span>Rendering at full resolution…</span></div>
      <div class="meta" id="meta" translate="no"></div>
      <div class="seg" id="fmtSeg" role="group" aria-label="File format">
        <button type="button" data-fmt="png" aria-pressed="true">PNG</button>
        <button type="button" data-fmt="jpeg" aria-pressed="false">JPEG</button>
      </div>
      <div class="btns">
        <a class="btn primary" id="dl" role="button" aria-disabled="true">Download</a>
        <button class="btn" id="sheetClose" type="button">Close</button>
      </div>
      <p class="hint" style="margin-top:10px">If the download doesn’t start, press and hold the image above to save it.</p>
    </div>
  </div>

  <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
</div>

<script>
(() => {
'use strict';

const FONT = '"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif';
const TAU = Math.PI * 2;
const NB = '\u00a0';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const nfInt = new Intl.NumberFormat();
const nfOne = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });

/* PURE:BEGIN ------------------------------------------------------------ */

/* Gaussian blur approximated by three box passes (running sums, clamped edges). */
function boxesForGauss(sigma, n) {
  const wIdeal = Math.sqrt((12 * sigma * sigma) / n + 1);
  let wl = Math.floor(wIdeal);
  if (wl % 2 === 0) wl--;
  const wu = wl + 2;
  const mIdeal = (12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4);
  const m = Math.round(mIdeal);
  const sizes = [];
  for (let i = 0; i < n; i++) sizes.push(i < m ? wl : wu);
  return sizes;
}
function boxBlurH(scl, tcl, w, h, r) {
  const iarr = 1 / (r + r + 1);
  for (let i = 0; i < h; i++) {
    let ti = i * w, li = ti, ri = ti + r;
    const fv = scl[ti], lv = scl[ti + w - 1];
    let val = (r + 1) * fv;
    for (let j = 0; j < r; j++) val += scl[ti + j];
    for (let j = 0; j <= r; j++) { val += scl[ri++] - fv; tcl[ti++] = val * iarr; }
    for (let j = r + 1; j < w - r; j++) { val += scl[ri++] - scl[li++]; tcl[ti++] = val * iarr; }
    for (let j = w - r; j < w; j++) { val += lv - scl[li++]; tcl[ti++] = val * iarr; }
  }
}
function boxBlurT(scl, tcl, w, h, r) {
  const iarr = 1 / (r + r + 1);
  for (let i = 0; i < w; i++) {
    let ti = i, li = ti, ri = ti + r * w;
    const fv = scl[ti], lv = scl[ti + w * (h - 1)];
    let val = (r + 1) * fv;
    for (let j = 0; j < r; j++) val += scl[ti + j * w];
    for (let j = 0; j <= r; j++) { val += scl[ri] - fv; tcl[ti] = val * iarr; ri += w; ti += w; }
    for (let j = r + 1; j < h - r; j++) { val += scl[ri] - scl[li]; tcl[ti] = val * iarr; ri += w; li += w; ti += w; }
    for (let j = h - r; j < h; j++) { val += lv - scl[li]; tcl[ti] = val * iarr; li += w; ti += w; }
  }
}
function boxBlur(scl, tcl, w, h, r) {
  tcl.set(scl);
  boxBlurH(tcl, scl, w, h, r);
  boxBlurT(scl, tcl, w, h, r);
}
function blur(src, w, h, sigma) {
  const s = Math.max(0.5, Math.min(sigma, (Math.min(w, h) - 3) / 3));
  const a = Float32Array.from(src), b = new Float32Array(src.length);
  const bx = boxesForGauss(s, 3);
  boxBlur(a, b, w, h, (bx[0] - 1) / 2);
  boxBlur(b, a, w, h, (bx[1] - 1) / 2);
  boxBlur(a, b, w, h, (bx[2] - 1) / 2);
  return b;
}
function gradient(b, w, h) {
  const x = new Float32Array(w * h), y = new Float32Array(w * h);
  for (let j = 0; j < h; j++) {
    const jm = Math.max(j - 1, 0), jp = Math.min(j + 1, h - 1);
    for (let i = 0; i < w; i++) {
      const im = Math.max(i - 1, 0), ip = Math.min(i + 1, w - 1), k = j * w + i;
      x[k] = (b[j * w + ip] - b[j * w + im]) / ((ip - im) || 1);
      y[k] = (b[jp * w + i] - b[jm * w + i]) / ((jp - jm) || 1);
    }
  }
  return { x, y };
}
function percentile(arr, p) {
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < arr.length; i++) { const v = arr[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
  if (!(mx > mn)) return mn;
  const B = 2048, hist = new Uint32Array(B), k = (B - 1) / (mx - mn);
  for (let i = 0; i < arr.length; i++) hist[((arr[i] - mn) * k) | 0]++;
  const target = p * arr.length;
  let acc = 0;
  for (let b = 0; b < B; b++) { acc += hist[b]; if (acc >= target) return mn + (b + 1) / k; }
  return mx;
}
/* Normalise a gradient field so its 99.5th-percentile magnitude is 1, then compress (gamma) so
   gentle slopes still read as volume. Result vectors have length <= 1. */
function packVec(gx, gy, floor, gamma) {
  const n = gx.length, mag = new Float32Array(n);
  for (let i = 0; i < n; i++) mag[i] = Math.hypot(gx[i], gy[i]);
  const s = Math.max(percentile(mag, 0.995), floor);
  const ox = new Float32Array(n), oy = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const m = mag[i];
    if (m < 1e-9) continue;
    const f = Math.pow(Math.min(m / s, 1), gamma) / m;
    ox[i] = gx[i] * f; oy[i] = gy[i] * f;
  }
  return { x: ox, y: oy };
}
const enc = v => Math.round((clamp(v, -1, 1) * 0.5 + 0.5) * 255);

/* Luminance-based depth proxy -> packed textures.
   grad  RGBA: rg = coarse slope, ba = fine-detail slope (slope of fine blur minus coarse blur)
   hmap  RGBA: r = coarse luminance, g = stretched medium height, b = stretched coarse height */
function analyze(imgData) {
  const w = imgData.width, h = imgData.height, n = w * h, d = imgData.data;
  const lum = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) lum[i] = (0.2126 * d[j] + 0.7152 * d[j + 1] + 0.0722 * d[j + 2]) / 255;
  const L = Math.max(w, h);
  const bC = blur(lum, w, h, Math.max(1.5, 0.022 * L));
  const bM = blur(lum, w, h, Math.max(1.0, 0.008 * L));
  const bF = blur(lum, w, h, Math.max(1.0, 0.003 * L));
  const gc = gradient(bC, w, h), gf = gradient(bF, w, h);

/* A procedural still life, drawn with centred shading so it reads as volume under any light. */
function makeSample() {
  const W = 1500, H = 1000;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const shade = (rgb, f) => `rgb(${Math.min(255, Math.round(rgb[0] * f))},${Math.min(255, Math.round(rgb[1] * f))},${Math.min(255, Math.round(rgb[2] * f))})`;

  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#484b50'); bg.addColorStop(0.58, '#505359'); bg.addColorStop(0.585, '#565961'); bg.addColorStop(1, '#43464b');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  const contact = (cx, cy, rx, ry, a) => {
    g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
    const r = g.createRadialGradient(0, 0, rx * 0.15, 0, 0, rx);
    r.addColorStop(0, `rgba(0,0,0,${a})`); r.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
  };
  const sphere = (cx, cy, r, rgb, dots) => {
    const gr = g.createRadialGradient(cx - r * 0.06, cy - r * 0.12, r * 0.03, cx, cy, r);
    gr.addColorStop(0, shade(rgb, 1.12)); gr.addColorStop(0.5, shade(rgb, 0.95));
    gr.addColorStop(0.88, shade(rgb, 0.72)); gr.addColorStop(1, shade(rgb, 0.6));
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    if (dots) {
      g.save(); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.clip();
      for (let a = -3; a <= 3; a++) for (let b = -3; b <= 3; b++) {
        const u = a * 0.3 + (b % 2 ? 0.15 : 0), v = b * 0.27, rr = Math.hypot(u, v);
        if (rr > 0.93) continue;
        const z = Math.sqrt(1 - rr * rr), rad = r * 0.055 * (0.3 + 0.7 * z);
        g.fillStyle = 'rgba(30,20,10,.28)';
        g.beginPath(); g.ellipse(cx + u * r, cy + v * r, rad * (0.4 + 0.6 * z), rad, Math.atan2(v, u), 0, TAU); g.fill();
      }
      g.restore();
    }
  };
  const cylinder = (cx, top, w, hh, rgb) => {
    const rx = w / 2, ry = w * 0.15;
    const gr = g.createLinearGradient(cx - rx, 0, cx + rx, 0);
    gr.addColorStop(0, shade(rgb, 0.6)); gr.addColorStop(0.3, shade(rgb, 0.98)); gr.addColorStop(0.5, shade(rgb, 1.1));
    gr.addColorStop(0.72, shade(rgb, 0.92)); gr.addColorStop(1, shade(rgb, 0.58));
    g.fillStyle = gr; g.beginPath();
    g.moveTo(cx - rx, top); g.lineTo(cx - rx, top + hh);
    g.ellipse(cx, top + hh, rx, ry, 0, Math.PI, 0, true);
    g.lineTo(cx + rx, top);
    g.ellipse(cx, top, rx, ry, 0, 0, Math.PI, true);
    g.closePath(); g.fill();
    const cap = g.createRadialGradient(cx, top, ry * 0.1, cx, top, rx);
    cap.addColorStop(0, shade(rgb, 1.22)); cap.addColorStop(1, shade(rgb, 0.9));
    g.fillStyle = cap; g.beginPath(); g.ellipse(cx, top, rx, ry, 0, 0, TAU); g.fill();
    for (let k = 1; k <= 3; k++) {
      const y = top + hh * k / 4;
      g.lineWidth = 9; g.strokeStyle = 'rgba(0,0,0,.2)';
      g.beginPath(); g.ellipse(cx, y, rx, ry, 0, 0.02, Math.PI - 0.02); g.stroke();
      g.lineWidth = 2.5; g.strokeStyle = 'rgba(255,255,255,.2)';
      g.beginPath(); g.ellipse(cx, y + 6, rx, ry, 0, 0.02, Math.PI - 0.02); g.stroke();
    }
  };

  contact(470, 842, 270, 42, 0.5);
  contact(980, 800, 160, 28, 0.5);
  contact(1250, 832, 130, 24, 0.5);
  cylinder(980, 360, 250, 440, [159, 216, 196]);
  sphere(470, 590, 250, [240, 165, 138], false);
  sphere(1250, 720, 112, [241, 215, 138], true);

}

/* ---------------------------------------------------------------------- */
/* Stage layout + overlay                                                  */
/* ---------------------------------------------------------------------- */
const stage = $('#stage'), ui = $('#ui'), uctx = ui.getContext('2d');
let dpr = 1, SW = 1, SH = 1;
const rect = { x: 0, y: 0, w: 1, h: 1 };
let uiRect = { left: 0, top: 0 };

function layout() {
  const r = stage.getBoundingClientRect();
  uiRect = { left: r.left, top: r.top };
  SW = Math.max(1, r.width); SH = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  ui.width = Math.round(SW * dpr); ui.height = Math.round(SH * dpr);
  const pad = clamp(SW * 0.05, 16, 40);
  const aw = Math.max(40, SW - pad * 2), ah = Math.max(40, SH - pad - Math.max(pad, 46));
  const nat = state.nat || { w: 3, h: 2 };
  const s = Math.min(aw / nat.w, ah / nat.h);
  rect.w = Math.max(40, nat.w * s); rect.h = Math.max(40, nat.h * s);
  rect.x = (SW - rect.w) / 2; rect.y = pad + (ah - rect.h) / 2;
  glc.style.left = rect.x + 'px'; glc.style.top = rect.y + 'px';
  glc.style.width = rect.w + 'px'; glc.style.height = rect.h + 'px';
  let bw = Math.round(rect.w * dpr), bh = Math.round(rect.h * dpr);
  const cap = 1800 / Math.max(bw, bh);
  if (cap < 1) { bw = Math.round(bw * cap); bh = Math.round(bh * cap); }
  glc.width = Math.max(1, bw); glc.height = Math.max(1, bh);

}

const toPx = (lx, ly) => ({ x: rect.x + lx * rect.w, y: rect.y + ly * rect.h });
const stemK = () => Math.min(rect.w, rect.h) * 0.3;

function roundRectPath(g, x, y, w, hh, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + hh, r); g.arcTo(x + w, y + hh, x, y + hh, r);
  g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function pill(g, text, cx, cy) {
  g.font = '500 11.5px ' + FONT;
  const tw = g.measureText(text).width, pw = tw + 16, ph = 22;
  const px = clamp(cx - pw / 2, 6, SW - pw - 6), py = clamp(cy - ph / 2, 6, SH - ph - 6);
  g.fillStyle = 'rgba(22,24,26,.88)'; roundRectPath(g, px, py, pw, ph, 7); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1; g.stroke();
  g.fillStyle = '#ebe8e2'; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillText(text, px + 8, py + ph / 2 + 0.5);
}
function tag(g, text, x, y, align) {
  g.font = '500 11.5px ' + FONT;
  const tw = g.measureText(text).width, pw = tw + 16, ph = 22;
  const px = align === 'right' ? x - pw : x;
  g.fillStyle = 'rgba(22,24,26,.8)'; roundRectPath(g, px, y, pw, ph, 7); g.fill();
  g.fillStyle = '#ebe8e2'; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillText(text, px + 8, y + ph / 2 + 0.5);

/* Direction and elevation of the light as seen from the aim point. Recomputed on every draw. */
function lightAngles() {
  const asp = state.nat ? state.nat.h / state.nat.w : 1;
  const dx = P.lx - P.tx, dy = (P.ly - P.ty) * asp, hd = Math.hypot(dx, dy);
  const el = Math.atan2(P.lz, hd) * 180 / Math.PI;
  const az = hd < 0.012 ? null : (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
  return { az, el };
}

function drawOverlay() {
  const g = uctx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, SW, SH);
  if (!state.assets) return;
  const [cr, cg, cb] = gelColor();
  const col = `rgb(${cr},${cg},${cb})`, rgba = a => `rgba(${cr},${cg},${cb},${a})`;

  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.12)';
  g.strokeRect(rect.x - 0.5, rect.y - 0.5, rect.w + 1, rect.h + 1);

  if (V === 'split') {
    const sx = rect.x + split * rect.w, cy = rect.y + rect.h / 2;
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(sx, rect.y); g.lineTo(sx, rect.y + rect.h); g.stroke();
    g.fillStyle = '#ebe8e2'; g.beginPath(); g.arc(sx, cy, 15, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = '#1b1c1e';
    g.beginPath(); g.moveTo(sx - 4, cy); g.lineTo(sx - 9, cy - 4.5); g.lineTo(sx - 9, cy + 4.5); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(sx + 4, cy); g.lineTo(sx + 9, cy - 4.5); g.lineTo(sx + 9, cy + 4.5); g.closePath(); g.fill();
    tag(g, 'Original', rect.x + 10, rect.y + 10, 'left');
    tag(g, 'Relit', rect.x + rect.w - 10, rect.y + 10, 'right');
  } else if (V === 'original') {
    tag(g, 'Original', rect.x + 10, rect.y + 10, 'left');
  } else if (preview === 1) {
    tag(g, 'Surface Normals', rect.x + 10, rect.y + 10, 'left');
  } else if (preview === 2) {
    tag(g, 'Depth Estimate', rect.x + 10, rect.y + 10, 'left');
  }

  g.save();
  g.globalAlpha = V === 'original' ? 0.4 : 1;
  const base = toPx(P.lx, P.ly), k = stemK();
  const lamp = { x: base.x, y: base.y - P.lz * k };
  const tg = toPx(P.tx, P.ty);
  const behind = P.lz < -0.2;

  // reach of the light on the picture plane
  const Rh = Math.sqrt(Math.max(P.radius * P.radius - P.lz * P.lz, 0)) * rect.w;
  g.setLineDash([2, 7]); g.lineWidth = 1.5; g.strokeStyle = rgba(0.38);
  g.beginPath(); g.arc(base.x, base.y, Math.min(Rh, 6000), 0, TAU); g.stroke();

    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(255,255,255,.75)');
    g.strokeStyle = gr; g.lineWidth = 2; g.setLineDash(behind ? [2, 6] : [9, 6]); g.lineCap = 'round';
    g.beginPath(); g.moveTo(base.x + ux * 12, base.y + uy * 12); g.lineTo(tg.x - ux * 16, tg.y - uy * 16); g.stroke();
    g.setLineDash([]);
    const tx = tg.x - ux * 12, ty = tg.y - uy * 12;
    g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath();
    g.moveTo(tx, ty); g.lineTo(tx - ux * 9 - uy * 5, ty - uy * 9 + ux * 5); g.lineTo(tx - ux * 9 + uy * 5, ty - uy * 9 - ux * 5);

  g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = 1.75;
  g.beginPath(); g.arc(tg.x, tg.y, 9, 0, TAU); g.stroke();
  g.beginPath();
  g.moveTo(tg.x - 15, tg.y); g.lineTo(tg.x - 11, tg.y); g.moveTo(tg.x + 11, tg.y); g.lineTo(tg.x + 15, tg.y);
  g.moveTo(tg.x, tg.y - 15); g.lineTo(tg.x, tg.y - 11); g.moveTo(tg.x, tg.y + 11); g.lineTo(tg.x, tg.y + 15);
  g.stroke();

  g.beginPath(); g.ellipse(base.x, base.y + 1, 9, 4, 0, 0, TAU); g.fill();
  if (Math.abs(P.lz * k) > 8) {
    g.strokeStyle = rgba(0.85); g.lineWidth = 1.5; g.setLineDash(behind ? [2, 4] : []);
    g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(lamp.x, lamp.y); g.stroke(); g.setLineDash([]);
  }
  g.fillStyle = col; g.strokeStyle = '#17181a'; g.lineWidth = 2;
  g.beginPath(); g.arc(base.x, base.y, 4.5, 0, TAU); g.fill(); g.stroke();

  const glow = g.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, 46);
  glow.addColorStop(0, rgba(0.55)); glow.addColorStop(1, rgba(0));
  g.fillStyle = glow; g.beginPath(); g.arc(lamp.x, lamp.y, 46, 0, TAU); g.fill();
  g.strokeStyle = col; g.lineWidth = 2.2; g.lineCap = 'round';
  for (let i = 0; i < 8; i++) {

  const text = P.lz < -0.05
    ? `Direction ${dirTxt}, behind subject`
    : `Direction ${dirTxt}, elevation ${Math.round(an.el)}°`;
  if (V !== 'original') {
    if (len > 110) {
      let nx = -dy / len, ny = dx / len;
      if (ny > 0) { nx = -nx; ny = -ny; }

/* ---------------------------------------------------------------------- */
/* Rendering loop                                                          */
/* ---------------------------------------------------------------------- */
let raf = 0;
function invalidate() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; frame(); });
}
function frame() {
  draw();
  drawOverlay();
  syncControls();
}
let tweenId = 0;
const cancelTween = () => { tweenId++; };
function manual() { cancelTween(); activeLook = null; syncLooks(); invalidate(); }

/* ---------------------------------------------------------------------- */
/* Pointer + keyboard on the stage                                         */
/* ---------------------------------------------------------------------- */
let drag = null;
const ptOf = e => ({ x: e.clientX - uiRect.left, y: e.clientY - uiRect.top });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rig = () => {
  const base = toPx(P.lx, P.ly);
  return { base, lamp: { x: base.x, y: base.y - P.lz * stemK() } };
};
const splitX = () => rect.x + split * rect.w;

function nearestHandle(p) {
  const { base, lamp } = rig(), tg = toPx(P.tx, P.ty);
  const dl = Math.min(dist(p, base), dist(p, lamp)), dt = dist(p, tg);
  return dt < dl ? { kind: 'aim', d: dt } : { kind: 'light', d: dl };
}

/* Move the light base to a pixel position. With "Aim Moves With Light" on, the aim point shifts by the same
   amount, so the whole rig slides together and the lighting is recomputed from the new positions. */
function moveLamp(x, y) {
  const stem = P.lz * stemK();
  const loX = 10, hiX = SW - 10, loY = 10 + Math.max(0, stem), hiY = SH - 10 + Math.min(0, stem);
  const cur = toPx(P.lx, P.ly);
  let dx = clamp(x, loX, hiX) - cur.x, dy = clamp(y, loY, hiY) - cur.y;
  if (P.follow) {
    const t = toPx(P.tx, P.ty);
    dx = clamp(dx, Math.max(loX - cur.x, 10 - t.x), Math.min(hiX - cur.x, SW - 10 - t.x));
    dy = clamp(dy, Math.max(loY - cur.y, 10 - t.y), Math.min(hiY - cur.y, SH - 10 - t.y));
    P.tx += dx / rect.w; P.ty += dy / rect.h;
  }
  P.lx += dx / rect.w; P.ly += dy / rect.h;
  manual();
}
function moveAim(x, y) {
  x = clamp(x, 10, SW - 10); y = clamp(y, 10, SH - 10);
  P.tx = (x - rect.x) / rect.w; P.ty = (y - rect.y) / rect.h;
  manual();

ui.addEventListener('pointerenter', () => { uiRect = stage.getBoundingClientRect(); });
ui.addEventListener('pointerdown', e => {
  if (!state.assets) return;
  uiRect = stage.getBoundingClientRect();
  ui.setPointerCapture(e.pointerId);
  ui.focus({ preventScroll: true });
  const p = ptOf(e), hit = nearestHandle(p), near = hit.d < 34;
  if (V === 'split' && !near && Math.abs(p.x - splitX()) < 22 && p.y > rect.y - 14 && p.y < rect.y + rect.h + 14) {
    drag = { type: 'split' };
    split = clamp((p.x - rect.x) / rect.w, 0.02, 0.98); invalidate();
    document.body.classList.add('dragging');
    return;
  }
  if (V === 'original') setView('relit');
  if (near && hit.kind === 'aim') {
    const tg = toPx(P.tx, P.ty);
    drag = { type: 'aim', ox: tg.x - p.x, oy: tg.y - p.y };
    moveAim(p.x + drag.ox, p.y + drag.oy);
  } else {
    const { base } = rig();
    drag = { type: 'light', ox: near ? base.x - p.x : 0, oy: near ? base.y - p.y : 0 };
    moveLamp(p.x + drag.ox, p.y + drag.oy);
  }
  document.body.classList.add('dragging');
  ui.style.cursor = 'grabbing';
  e.preventDefault();
});
ui.addEventListener('pointermove', e => {
  const p = ptOf(e);
  if (drag) {
    if (drag.type === 'split') { split = clamp((p.x - rect.x) / rect.w, 0.02, 0.98); invalidate(); }
    else if (drag.type === 'aim') moveAim(p.x + drag.ox, p.y + drag.oy);
    else moveLamp(p.x + drag.ox, p.y + drag.oy);
    return;
  }
  if (!state.assets) return;
  if (nearestHandle(p).d < 30) ui.style.cursor = 'grab';
  else if (V === 'split' && Math.abs(p.x - splitX()) < 14) ui.style.cursor = 'ew-resize';
  else ui.style.cursor = 'crosshair';
});
const endDrag = () => { drag = null; document.body.classList.remove('dragging'); ui.style.cursor = 'crosshair'; };
ui.addEventListener('pointerup', endDrag);
ui.addEventListener('pointercancel', endDrag);
ui.addEventListener('wheel', e => {
  if (!state.assets) return;
  e.preventDefault();
  if (V === 'original') setView('relit');
  P.lz = clamp(P.lz - e.deltaY * 0.0008, -0.8, 1.5);
  manual();
}, { passive: false });
ui.addEventListener('keydown', e => {
  if (V === 'split' && (e.key === '[' || e.key === ']')) {
    e.preventDefault();
    split = clamp(split + (e.key === ']' ? 0.02 : -0.02), 0.02, 0.98);
    invalidate();
    return;
  }
  const st = e.shiftKey ? 0.05 : 0.01;
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (dirs[e.key]) {
    e.preventDefault();
    if (V === 'original') setView('relit');
    const [sx, sy] = dirs[e.key];
    if (e.altKey) {
      const tg = toPx(P.tx, P.ty);
      moveAim(tg.x + sx * st * rect.w, tg.y + sy * st * rect.h);
    } else {
      const { base } = rig();
      moveLamp(base.x + sx * st * rect.w, base.y + sy * st * rect.h);
    }
    return;
  }
  if (e.key === 'PageUp' || e.key === 'PageDown') {
    e.preventDefault();
    P.lz = clamp(P.lz + (e.key === 'PageUp' ? 1 : -1) * st * 3, -0.8, 1.5);
    manual();
  }
});

/* Custom slider. A touch only moves it if the touch starts on the handle and then travels sideways,
   so scrolling the page with a finger that passes over a slider never changes a value. A mouse can
   click or drag anywhere on the rail. Keyboard: arrows, Page Up/Down, Home, End. */
function makeSlider(def) {
  const id = 's-' + def.key + (def.idx != null ? def.idx : '');
  const span = def.max - def.min;
  const read = () => (def.idx != null ? P[def.key][def.idx] : P[def.key]);
  const write = v => { if (def.idx != null) P[def.key][def.idx] = v; else P[def.key] = v; };
  const out = h('output', { id: id + '-o', translate: 'no' });
  const lbl = h('span', { class: 'lbl', id: id + '-l' }, def.label);
  const el = h('div', {
    class: 'sl' + (def.track ? ' plain' : ''), id, role: 'slider', tabindex: '0',
    'aria-labelledby': id + '-l', 'aria-valuemin': String(def.min), 'aria-valuemax': String(def.max)
  }, h('span', { class: 'rail' }), h('span', { class: 'fill' }), h('span', { class: 'knob' }));
  if (def.track) el.style.setProperty('--tb', def.track);

  const snap = v => {
    v = clamp(v, def.min, def.max);
    const n = Math.round((v - def.min) / def.step);
    return +Math.min(def.max, def.min + n * def.step).toFixed(4);
  };
  const commit = v => {
    const s = snap(v);
    if (s === read()) return;
    write(s);
    manual();
  };
  const geom = () => { const r = el.getBoundingClientRect(); return { left: r.left, w: Math.max(1, r.width - 22) }; };
  const valueAt = (x, gm) => def.min + clamp((x - gm.left - 11) / gm.w, 0, 1) * span;

  let g = null;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const gm = geom();
    const off = e.clientX - (gm.left + 11 + ((read() - def.min) / span) * gm.w);
    if (e.pointerType !== 'mouse') {
      if (Math.abs(off) > 30) return;                       // touch must begin on the handle
      g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, off, active: false };
      return;
    }
    const grab = Math.abs(off) <= 12 ? off : 0;
    g = { id: e.pointerId, off: grab, active: true };
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
    el.focus({ preventScroll: true });
    commit(valueAt(e.clientX - grab, gm));
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    if (!g.active) {
      const dx = Math.abs(e.clientX - g.x0), dy = Math.abs(e.clientY - g.y0);
      if (dx < 6 || dx < dy * 1.2) return;                  // wait for clear sideways intent
      g.active = true;
      el.setPointerCapture(e.pointerId);
      el.classList.add('drag');
      el.focus({ preventScroll: true });
    }
    commit(valueAt(e.clientX - g.off, geom()));
  });
  const end = e => { if (g && e.pointerId === g.id) { g = null; el.classList.remove('drag'); } };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
  el.addEventListener('keydown', e => {
    const big = def.step * 10;
    let v = read(), used = true;
    switch (e.key) {
      case 'ArrowLeft': case 'ArrowDown': v -= e.shiftKey ? big : def.step; break;
      case 'ArrowRight': case 'ArrowUp': v += e.shiftKey ? big : def.step; break;
      case 'PageDown': v -= big; break;
      case 'PageUp': v += big; break;
      case 'Home': v = def.min; break;
      case 'End': v = def.max; break;
      default: used = false;
    }
    if (used) { e.preventDefault(); commit(v); }
  });

  sliderRefs.push({ def, el, out, read });
  return h('div', { class: 'ctl' }, h('div', { class: 'top' }, lbl, out), el);
}

function applyTarget(target) {
  const keys = ['lx', 'ly', 'lz', 'tx', 'ty', 'beam', 'intensity', 'radius', 'falloff', 'kelvin', 'ambient', 'exposure', 'shadow', 'soft', 'spec'];
  const from = {};
  keys.forEach(k => { from[k] = P[k]; });
  if (target.mode) P.mode = target.mode;
  if (target.rgb) P.rgb = target.rgb.slice();
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 0 : 320, t0 = performance.now();
  const myId = ++tweenId;                          // a newer tween or any manual edit cancels this one
  if (V === 'original') setView('relit');
  const step = now => {
    if (myId !== tweenId) return;
    const u = dur ? clamp((now - t0) / dur, 0, 1) : 1, e = 1 - Math.pow(1 - u, 3);
    keys.forEach(k => { if (k in target) P[k] = from[k] + (target[k] - from[k]) * e; });
    invalidate();
    if (u < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const sheet = $('#sheet'), pv = $('#pv'), meta = $('#meta'), dl = $('#dl');
const exp = { canvas: null, url: null, fmt: 'png', size: null, token: 0 };
let sheetOpener = null;

function renderFull() {
  const gl = GL.gl, nat = state.nat;
  const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  const maxSide = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), vp[0], vp[1], 8192);
  let s = Math.min(1, maxSide / Math.max(nat.w, nat.h));
  const AREA = 16777216;                       // keep within common mobile canvas limits
  if (nat.w * nat.h * s * s > AREA) s = Math.sqrt(AREA / (nat.w * nat.h));
  const ew = Math.max(1, Math.floor(nat.w * s)), eh = Math.max(1, Math.floor(nat.h * s));
  const full = drawToCanvas(state.src, ew, eh, false);
  const tex = texFromSource(full);
  full.width = full.height = 1;
  const pw = glc.width, ph = glc.height;
  glc.width = ew; glc.height = eh;
  try {
    draw({ tex, final: true });
    const out = document.createElement('canvas');
    out.width = ew; out.height = eh;
    out.getContext('2d').drawImage(glc, 0, 0);
    return { canvas: out, w: ew, h: eh };
  } finally {
    gl.deleteTexture(tex);
    glc.width = pw; glc.height = ph;
    invalidate();
  }
}

function encodeExport() {
  const token = ++exp.token;
  const type = exp.fmt === 'png' ? 'image/png' : 'image/jpeg';
  dl.setAttribute('aria-disabled', 'true');
  exp.canvas.toBlob(blob => {
    if (token !== exp.token || !blob) {
      if (!blob && token === exp.token) meta.textContent = 'This device couldn’t encode the image. Try the other format.';
      return;
    }
    if (exp.url) URL.revokeObjectURL(exp.url);
    exp.url = URL.createObjectURL(blob);
    const ext = exp.fmt === 'png' ? 'png' : 'jpg';
    const img = h('img', { alt: 'Relit photo preview', width: exp.size.w, height: exp.size.h });
    img.onerror = () => {                       // blob: images can be blocked in sandboxed previews; fall back to a data URL
      if (img.dataset.fb) return;
      img.dataset.fb = '1';
      const fr = new FileReader();
      fr.onload = () => { img.src = fr.result; dl.href = fr.result; };
      fr.readAsDataURL(blob);
    };
    img.src = exp.url;
    pv.replaceChildren(img);
    const note = (exp.size.w !== state.nat.w || exp.size.h !== state.nat.h)
      ? `, reduced from ${nfInt.format(state.nat.w)}${NB}×${NB}${nfInt.format(state.nat.h)} to fit this device` : '';
    meta.textContent = `${nfInt.format(exp.size.w)}${NB}×${NB}${nfInt.format(exp.size.h)}${NB}px, ${exp.fmt.toUpperCase()}, ${nfOne.format(blob.size / 1048576)}${NB}MB${note}`;
    dl.href = exp.url;
    dl.setAttribute('download', `${state.name}-relit.${ext}`);
    dl.textContent = `Download ${exp.fmt.toUpperCase()}`;
    dl.removeAttribute('aria-disabled');
  }, type, 0.93);
}

async function openExport() {
  if (!state.assets) return;
  sheetOpener = document.activeElement;
  sheet.hidden = false;
  $('#sheetClose').focus();
  pv.replaceChildren(h('span', {}, 'Rendering at full resolution…'));
  meta.textContent = '';
  dl.setAttribute('aria-disabled', 'true'); dl.removeAttribute('href'); dl.textContent = 'Download';
  await nextFrame(); await nextFrame();
  try {
    const r = renderFull();
    exp.canvas = r.canvas; exp.size = { w: r.w, h: r.h };
    encodeExport();
  } catch (err) {
    pv.replaceChildren(h('span', {}, 'Export failed. The photo may be too large for this device. Close this, then try again or open a smaller photo.'));
  }
}
function closeExport() {
  sheet.hidden = true; exp.token++;
  if (exp.url) { URL.revokeObjectURL(exp.url); exp.url = null; }
  exp.canvas = null;
  pv.replaceChildren();
  if (sheetOpener && sheetOpener.focus) sheetOpener.focus();
}
$('#btnExport').addEventListener('click', openExport);
$('#sheetClose').addEventListener('click', closeExport);
sheet.addEventListener('click', e => { if (e.target === sheet) closeExport(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeExport(); });
sheet.addEventListener('keydown', e => {          // keep Tab inside the dialog
